name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Manuel tetikleme butonu

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu İndir
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Android SDK Kur
        uses: android-actions/setup-android@v3

      - name: NPM Paketleri Yükle
        run: npm install

      - name: Capacitor Android Senkronize Et
        run: |
          npx cap sync android

      - name: Gradle İzinleri Ver
        run: chmod +x android/gradlew

      - name: Debug APK Derle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: APK Dosyasını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: OkulYokla-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: APK Boyutunu Göster
        run: |
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          echo "✅ APK başarıyla derlendi!"
